{% load l10n %}
<ul class="composition">
    {% for it in items %}
    <li>
        <span class="swatch" style="background: {{ it.color }}" aria-hidden="true"></span>
        <span class="composition-body">
            <span class="composition-line"><span>{{ it.name }}</span><span class="num">{{ it.grams|floatformat:0 }} г{% if it.pieces %} · ≈ {{ it.pieces }} шт{% endif %}</span></span>
            <span class="bar" aria-hidden="true"><span style="width: {{ it.width|unlocalize }}%"></span></span>
        </span>
    </li>
    {% endfor %}
</ul>
